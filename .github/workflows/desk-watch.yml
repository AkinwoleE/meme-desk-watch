# Read-only watcher for the meme-desk. NEVER signs or sends transactions.
# Triggers: schedule (every 10 min, may lag) and workflow_dispatch (for an external cron).
name: desk-watch

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Queue, don't cancel: a cancelled run could drop an alert.
concurrency:
  group: desk-watch
  cancel-in-progress: false

permissions:
  contents: write  # commit .alert-state.json only, when incidents change

jobs:
  watch:
    name: Check GC, stops, exits, heartbeat
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: github.repository == 'AkinwoleE/meme-desk-watch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run watcher
        id: check
        env:
          DESK_WEBHOOK_URL: ${{ secrets.DESK_WEBHOOK_URL }}
          DESK_WEBHOOK_KEY: ${{ secrets.DESK_WEBHOOK_KEY }}
          DESK_WEBHOOK_HEADER: ${{ vars.DESK_WEBHOOK_HEADER || 'Authorization: Bearer' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node src/check.mjs

      - name: Commit alert-state if it changed
        run: |
          if git diff --quiet -- .alert-state.json; then
            echo "alert-state unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .alert-state.json
          staged="$(git diff --cached --name-only)"
          if [ "$staged" != ".alert-state.json" ]; then
            echo "refusing to commit unexpected files: $staged"
            git restore --staged .
            exit 1
          fi
          git commit -m "chore: update alert-state"
          # Rebase onto any watch.json the box pushed during this run, then push.
          git pull --rebase --autostash origin main || {
            git rebase --abort || true
            echo "rebase failed; leaving alert-state unpushed (next run will retry)"
            exit 0
          }
          git push origin main
